<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestión · Órale Padre</title>
<meta name="theme-color" content="#7C2430">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;800&display=swap">
<style>
  :root{--crema:#F5EEE6;--crema-3:#FBF7F2;--linea:#DDD0C2;--tinta:#241A1C;--humo:#6E5C60;--burdeos:#7C2430}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--crema);color:var(--tinta);font:16px/1.5 'Archivo',Arial,sans-serif;padding:16px}
  main{width:min(520px,100%);text-align:center}
  img{width:150px;height:auto}
  h1{font:400 34px/1 'Anton','Arial Narrow',Impact,sans-serif;text-transform:uppercase;color:var(--burdeos);margin:12px 0 4px}
  p{color:var(--humo);margin:0 0 22px}
  nav{display:grid;gap:12px}
  a{display:block;text-decoration:none;color:var(--tinta);background:var(--crema-3);border:2px solid var(--linea);border-radius:14px;padding:18px 20px;text-align:left}
  a:hover,a:focus-visible{border-color:var(--burdeos)}
  a b{display:block;font:400 24px/1.1 'Anton','Arial Narrow',Impact,sans-serif;text-transform:uppercase;color:var(--burdeos)}
  a span{color:var(--humo);font-size:14px}
</style>
</head>
<body>
<main>
  <img src="/img/logo-tinta.png" alt="Órale Padre" width="150" height="150">
  <h1>Gestión</h1>
  <p>Herramientas internas del equipo. Entra con tu usuario.</p>
  <nav>
    <a href="/tpv/"><b>TPV</b><span>Mesas, comandas a cocina y cobro</span></a>
    <a href="/comandas/"><b>Comandas</b><span>Pantalla de cocina: pedidos de sala y web</span></a>
    <a href="/admin/"><b>Admin</b><span>Ventas, carta, plano, promociones, horario y usuarios (encargados)</span></a>
  </nav>
</main>
</body>
</html>
